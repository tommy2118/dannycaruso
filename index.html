<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danny Caruso, Actor</title>
  <meta name="description" content="Danny Caruso, actor. Credits, training and contact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <header class="house-bar">
    <a class="monogram" href="#top" aria-label="Danny Caruso, back to the top">DC</a>
    <nav aria-label="Sections">
      <a href="#shows">The shows</a>
      <a href="#resume">Resume</a>
    </nav>
  </header>

  <main>
    <section class="cue cue--preshow" id="top" data-cue="0">
      <p class="eyebrow">Preshow <span aria-hidden="true">&middot;</span> the ghost light is on</p>
      <h1 class="name">Danny <em>Caruso</em></h1>
      <p class="billing">Actor</p>
      <p class="hint" id="shows">Scroll to run the show</p>
    </section>

    <div data-shows></div>

    <section class="cue cue--curtain" id="resume" aria-labelledby="resume-title">
      <article class="playbill">
        <header class="playbill-head">
          <img data-headshot alt="Photo of Danny Caruso">
          <div>
            <p class="playbill-kicker">Curtain call</p>
            <h2 id="resume-title">Danny Caruso</h2>
            <p class="playbill-billing">Actor</p>
            <p data-now></p>
            <p class="small">Program: <span data-program></span></p>
          </div>
        </header>

        <h3>Theater</h3>
        <table class="credits">
          <thead><tr><th scope="col">Production</th><th scope="col">Role</th><th scope="col">Company</th><th scope="col">Year</th></tr></thead>
          <tbody data-credits></tbody>
        </table>

        <h3>Training</h3>
        <ul class="training" data-training></ul>

        <h3>Contact</h3>
        <p data-contact></p>

      </article>
    </section>
  </main>

  <div class="calling" aria-live="polite">
    <span class="cue-light" aria-hidden="true"></span>
    <span class="sm">SM</span>
    <span class="call" data-call></span>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
